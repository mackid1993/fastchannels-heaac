name: Build HE-AAC image

# Build upstream FastChannels main + the HE-AAC module, test it, publish
# ghcr.io/<owner>/fastchannels-heaac:latest. Manual runs, and every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: kineticman/FastChannels
  UPSTREAM_BRANCH: main
  IMAGE: ghcr.io/${{ github.repository_owner }}/fastchannels-heaac

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5
        with:
          path: overlay

      - name: Check out upstream main
        id: up
        run: |
          git clone --depth 1 --branch "$UPSTREAM_BRANCH" "https://github.com/$UPSTREAM_REPO.git" upstream
          sha=$(git -C upstream rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Upstream $UPSTREAM_BRANCH: $sha"

      - name: Apply the HE-AAC module and the one hook line
        run: overlay/scripts/apply.sh upstream

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64
          load: true
          tags: fastchannels-heaac:ci
          labels: |
            org.opencontainers.image.title=FastChannels HE-AAC (test)
            org.opencontainers.image.description=kineticman/FastChannels main; DirecTV plays the HE-AAC audio instead of AC-3
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.up.outputs.sha }}
          build-args: |
            YTDLP_REFRESH=${{ github.run_id }}
            FC_PLAYER_APK_REFRESH=${{ github.run_id }}

      - name: Smoke-test the image
        run: docker run --rm -w /app -v "$PWD/overlay/scripts:/ci:ro" --entrypoint python fastchannels-heaac:ci /ci/smoke_test.py

      - name: Boot test
        run: overlay/scripts/boot_test.sh fastchannels-heaac:ci

      - name: Publish to GHCR
        run: |
          for tag in latest "upstream-${{ steps.up.outputs.short }}"; do
            docker tag fastchannels-heaac:ci "$IMAGE:$tag"
            docker push -q "$IMAGE:$tag"
          done
          echo "Published $IMAGE:latest (upstream ${{ steps.up.outputs.short }})."
